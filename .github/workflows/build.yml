name: Tiernan Music Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Generate i18n
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate i18n
        run: flutter gen-l10n

      - name: Setup Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" || true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Generate keystore
        if: github.ref_type == 'tag'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/tiernan.jks \
            -alias tiernan \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass tiernan123 -keypass tiernan123 \
            -dname "CN=Tiernan Music, OU=Dev, O=yingo-server, L=Unknown, ST=Unknown, C=CN"

      - name: Build APK (debug)
        run: flutter build apk --debug --split-per-abi

      - name: Build APK (release)
        if: github.ref_type == 'tag'
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk || true

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: tiernan-debug-apks
          path: build/app/outputs/flutter-apk/*-debug.apk
          retention-days: 30

      - name: Upload release APKs
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tiernan-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 90

  # 视觉审查：用 Flutter 的无头渲染把页面写成 PNG。
  # 不用 Android 模拟器 —— GitHub 托管 runner 没有 KVM，模拟器跑不动且极不稳定。
  visual-review:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate i18n
        run: flutter gen-l10n

      - name: Render page screenshots
        run: flutter test test/screenshots_test.dart --reporter expanded

      - name: Package screenshots
        run: |
          if [ -d screenshots ]; then
            (cd screenshots && zip -r "../screenshots-${{ github.run_number }}.zip" .)
            ls -la screenshots-*.zip
          else
            echo "没有生成截图"
          fi

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiernan-screenshots
          path: screenshots-*.zip
          retention-days: 90

  release:
    needs: [build-apk, visual-review]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tiernan-release-apks
          path: artifacts

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: tiernan-screenshots
          path: screenshots

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            screenshots/screenshots-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
