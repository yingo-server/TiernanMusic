name: tiernan_music
description: 汀澜音乐 Tiernan Music — 非官方酷狗音乐第三方客户端
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # 状态管理 & 路由
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # 网络
  dio: ^5.5.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # 音频播放
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # 视频播放
  video_player: ^2.9.2
  chewie: ^1.8.5

  # 存储
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # WebView (人机验证)
  flutter_inappwebview: ^6.1.5

  # 图片缓存
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # 工具
  crypto: ^3.0.3
  archive: ^3.6.1
  image: ^4.2.0
  pointycastle: ^3.9.1
  equatable: ^2.0.5
  logger: ^2.4.0
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
