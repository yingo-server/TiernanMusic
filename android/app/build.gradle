plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace 'com.tiernan.music'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // B-3：API 22 无 java.time 等 API，需 desugaring
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId 'com.tiernan.music'
        minSdk 22
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // B-2：API 22 无 ART 原生 multidex，必须启用 LegacyMultiDex
        multiDexEnabled true
        // ABI 分包由 --split-per-abi 控制，这里不设 ndk.abiFilters
        // （两者同时设置会报 Conflicting configuration）
    }

    signingConfigs {
        tiernan {
            def keystoreFile = file('tiernan.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KS_STORE_PASS') ?: 'tiernan123'
                keyAlias 'tiernan'
                keyPassword System.getenv('KS_KEY_PASS') ?: 'tiernan123'
            }
        }
    }

    buildTypes {
        debug {
            if (file('tiernan.jks').exists()) {
                signingConfig signingConfigs.tiernan
            }
        }
        release {
            if (file('tiernan.jks').exists()) {
                signingConfig signingConfigs.tiernan
            }
            // R8 代码压缩 + 资源压缩（显著减小包体）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // B-2：API 21-22 multidex 支持
    implementation 'androidx.multidex:multidex:2.0.1'
    // B-3：coreLibraryDesugaring 依赖（java.time 等在 API 22 可用）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
